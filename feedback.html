<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback Beta — FirstPay</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f7f2;color:#172d24}.wrap{max-width:760px;margin:auto;padding:24px 18px}main{background:#fff;border:1px solid #e1e6de;border-radius:18px;padding:24px}label{display:block;font-weight:700;margin:18px 0 7px}select,textarea{width:100%;padding:13px;border:1px solid #cbd5cc;border-radius:10px;font:inherit}textarea{min-height:95px}.btn{border:0;border-radius:11px;padding:14px 18px;background:#245d46;color:#fff;font-weight:750;cursor:pointer;margin:12px 6px 0 0}.note{background:#f1f5ed;padding:14px;border-radius:12px}a{color:#245d46}footer{padding:22px;color:#63746b;font-size:13px}</style></head><body><div class="wrap"><a href="index.html">← FirstPay</a><main><h1>Ton retour nous aide à améliorer FirstPay.</h1><p>Dis-nous si le calculateur t'a aidé à anticiper le moment où ton argent risque de manquer.</p><div class="note"><b>Ce formulaire n'envoie rien :</b> il prépare un texte à copier. Ne partage pas de données bancaires ou sensibles.</div><label>Type de départ</label><select id="type"><option>Non précisé</option><option>PVT / Working Holiday</option><option>Job saisonnier</option><option>Emploi déjà trouvé</option><option>Départ en couple</option><option>Autre</option></select><label>Utilité du calculateur</label><select id="rating"><option>Non précisé</option><option>Très utile</option><option>Plutôt utile</option><option>Moyen</option><option>Peu utile</option><option>Pas du tout utile</option></select><label>Bug ou résultat étrange</label><textarea id="bug" placeholder="Ce que tu as remarqué…"></textarea><label>Ce qui manque ou serait utile</label><textarea id="ideas" placeholder="Suggestion…"></textarea><label>Autre commentaire</label><textarea id="other"></textarea><button class="btn" id="copy">Copier le feedback</button><button class="btn" onclick="document.querySelectorAll('textarea').forEach(t=>t.value='')">Effacer les commentaires</button><p id="status" aria-live="polite"></p></main><footer>Beta FirstPay · <a href="privacy.html">Confidentialité</a></footer></div><script>document.getElementById('copy').addEventListener('click',async()=>{let v=id=>document.getElementById(id).value.trim()||'—';let out=`Feedback FirstPay Beta
Départ: ${v('type')}
Utilité: ${v('rating')}
Bug: ${v('bug')}
Suggestion: ${v('ideas')}
Autre: ${v('other')}`;try{await navigator.clipboard.writeText(out);document.getElementById('status').textContent='Copié ! Colle ce texte dans ton message pour nous le transmettre.'}catch(e){let t=document.createElement('textarea');t.value=out;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();document.getElementById('status').textContent='Feedback copié ou sélectionné pour copie.'}})</script></body></html>
